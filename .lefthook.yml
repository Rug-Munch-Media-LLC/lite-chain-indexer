# ── lefthook.yml — fast git hooks ───────────────────────────
# Source of truth: standards/lefthook.yml
# NEW REPOS: symlink .lefthook.yml -> ../standards/lefthook.yml
# This template is for reference only; always prefer symlinking.
#
# Quick install:
#   ln -s ../standards/lefthook.yml .lefthook.yml
#   lefthook install
#
# For repo-specific overrides, create .lefthook.local.yml
# which lefthook auto-merges with the canonical config.
#
# Tools provided by canonical config:
#   Python lint:        ruff, mypy, pyright, bandit, semgrep
#   Python deps:        pip-audit (vulnerabilities), deptry (freshness, ratchet)
#   Security universal: gitleaks, envsitter, methodology-leak
#
# ── GATE POLICY (2026-09-29 adjudication) ──────────────────────────────
# Every command below either CAN fail, or is removed. A command that ends in
# `|| true` / `|| echo` and is not one of the three documented exceptions below
# is a defect: it reports a pass it did not verify.
#
# The three surviving non-blocking commands, and why:
#   mypy-report      — TRIAGE OUTPUT ONLY. `mypy lite_indexer/` has 129 real
#                      errors by design (_facade re-exports, Protocol attrs
#                      set outside __init__). The GATE is the shrink-only
#                      budget (scripts/check-mypy-budget.py) above it, which
#                      does fail. This one exists to print the list a dev is
#                      about to work through.
#   bearer-scan      — ADVISORY. Reports 31 findings; the 12 CRITICAL are
#                      `subprocess.run` argv-lists with shell=False, which is
#                      not command injection. Failing on them would be a false
#                      positive that trains people to skip hooks. Bandit is the
#                      blocking command-injection gate.
#   zoekt-incremental (post-commit) — the script is absent in this repo and the
#                      hook only runs if a sibling standards checkout exists;
#                      the reindex side effect is not a correctness gate.
#
# Every other `|| true` has been deleted. Two were not merely decorative but
# actively false — they printed success for a scan they had run and thrown
# away: `deptry` ("not available — skipping" while reporting 39 findings) and
# `pip-audit` (an invalid --severity flag that made it die before scanning).

pre-commit:
  parallel: true
  commands:
    # -- BLOCK internal infrastructure / methodology (UNIVERSAL) --
    methodology-leak:
      run: bash scripts/pre-commit-methodology-check.sh
      skip:
        - merge
        - rebase

    # -- BLOCK .env files (UNIVERSAL) --------------------------
    no-env-files:
      run: |
        if find . -maxdepth 3 -name '.env' -not -name '.env.example' \
          -not -path './.git/*' \
          -not -path '*/node_modules/*' \
          -not -path '*/venv/*' \
          -not -path '*/.venv/*' \
          -not -path '*/__pycache__/*' \
          | grep -q .; then
          echo "ERROR: .env files found. Move secrets to gopass."
          exit 1
        fi
      skip:
        - merge
        - rebase

    # -- Secret scanning (UNIVERSAL) ---------------------------
    gitleaks:
      run: gitleaks protect --staged --verbose

    # -- Python lint (PYTHON repos) ---------------------------
    ruff:
      glob: "*.py"
      run: ruff check --fix {staged_files} && ruff format {staged_files}
      stage_fixed: true

    # -- Frontend lint (FRONTEND repos) -----------------------

    # -- Frontend lint (FRONTEND repos) -----------------------
    # REMOVED (biome, oxlint): same reason as publint/knip/attw/typecheck
    # below — no package.json, no tsconfig.json, no tracked frontend source.
    # `npx biome check` / `npx oxlint` against a file glob that matches nothing
    # is a green tick on zero files.

    # -- Shell lint (INFRA repos) -----------------------------
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}

    # -- Dockerfile lint (INFRA repos) ------------------------
    hadolint:
      glob: "Dockerfile*"
      run: hadolint {staged_files}

    # -- SQL lint (ClickHouse dialect) -------------------------
    # CORRECTED from `--dialect postgres`: every file in migrations/ is
    # ClickHouse DDL, so the postgres dialect reported "unparsable section" on
    # 20 of 23 files — a false-fail masked by `|| echo`. Now uses the dialect
    # the .forgejo `migration-sql-lint` job uses.
    sqlfluff:
      glob: "migrations/*.sql"
      run: sqlfluff parse {staged_files} --dialect clickhouse

    # -- Dependency supply-chain (blocks hallucinated deps) ----
    # CORRECTED: the previous `osv-scanner scan source $FILES` exited 128 with
    # "No package sources found" — this repo has NO lockfile of any kind (0
    # requirements*.txt / package-lock / Cargo.lock / go.mod), so there is no
    # subject to scan and the `|| echo` hid it. Vulnerability scanning is done
    # by the pre-push `pip-audit` gate, which audits pyproject dependencies.
    osv-deps:
      glob: "{requirements*.txt,package-lock.json,pnpm-lock.yaml,yarn.lock,Cargo.lock,go.mod}"
      run: |
        echo "[osv] no lockfile changed in this commit — nothing to scan (see pre-push pip-audit)"

pre-push:
  parallel: true
  commands:
    # -- Full-repo secret scan (UNIVERSAL) --------------------
    gitleaks-full:
      run: gitleaks detect --source . --no-git -v

    # -- Structure gate (UNIVERSAL, no-op when absent) -------------------
    # Anti-god-module + fn-density + shrink-only ratchet (scripts/check-structure.py
    # + scripts/structure-baseline.json). Shrink freely; growth fails the gate.
    structure-gate:
      run: |
        if [ -f scripts/check-structure.py ]; then
          python3 scripts/check-structure.py
        fi

    # -- Python type check (PYTHON repos) ---------------------
    # Scoped to lite_indexer/ — the same scope both CI workflows use
    # (`.forgejo/workflows/ci.yml` and `.github/workflows/ci.yml` both run
    # `mypy lite_indexer/`). The hook previously ran `mypy .`, checking 4x the
    # surface (tests, api, scripts, examples) that CI never checked, and
    # failing on 2,354 errors of which 2,041 were in tests/. Aligning the hook
    # with CI is the honest fix; it does not hide anything CI was already
    # checking.
    #
    # The gate is the shrink-only BUDGET (scripts/check-mypy-budget.py), not
    # an absolute-zero check. mypy has been red here since before 2026-09-28:
    # lite_indexer/ reports 278 errors, most of them `attr-defined` on two
    # deliberate patterns mypy cannot resolve — the `_facade` re-export idiom
    # (13 modules) and Protocol/mixin attributes assigned outside __init__.
    # That is an architectural choice, not a backlog of separate defects, so
    # an absolute-zero gate is unreachable without a rewrite. The budget ratchets
    # the count DOWN: any file whose errors rise fails the gate, and
    # `--update-baseline` refuses to raise it or admit a new file with debt.
    # Clearing the debt is then ordinary incremental work.
    mypy:
      glob: "*.py"
      run: python3 scripts/check-mypy-budget.py --repo .

    # Raw mypy is kept available for local TRIAGE ONLY and is NOT a gate.
    # It is expected to be red: lite_indexer/ has 129 errors, nearly all
    # `attr-defined` on the deliberate `_facade` re-export idiom and
    # Protocol/mixin attributes assigned outside __init__ (see the `mypy`
    # command above). The `mypy` budget gate is the one that can fail.
    mypy-report:
      glob: "*.py"
      run: mypy lite_indexer/ --ignore-missing-imports || true

    # -- Python security scan (PYTHON repos) ------------------
    # -x: without this, `-r .` walked .venv-ci — a 947 MB virtualenv holding
    #     6,610 of the repo's 7,213 Python files — and reported ~23,000
    #     findings from vendored site-packages, burying the ~600 files we own.
    #     Mirrors the .gitignore and the [tool.bandit] block in pyproject.toml
    #     (bandit 1.9.4 does not read that block, so it is restated here).
    # -s B608: hardcoded_sql_expressions. 99 findings, every one an f-string
    #     interpolating a module-constant table name or an internally-derived
    #     fragment (CH_TABLE, chain_sql, column, page_limit) with values bound
    #     as parameters. The only user-supplied SQL, POST /api/v1/query, is
    #     gated by api/security.py:validate_readonly — a 20-table allowlist that
    #     blocks non-allowlisted tables, write keywords, and UNION escapes
    #     (verified, not assumed). SQL discipline here is enforced by that
    #     validator and the `# nosemgrep: formatted-sql-query` convention, so
    #     scanning for it again costs 99 annotations and finds nothing.
    bandit:
      glob: "*.py"
      run: >-
        bandit -r . -ll
        -x .venv,.venv-*,venv,./*/env,./env,build,dist,node_modules,.serena,.mypy_cache,.pytest_cache,.ruff_cache,htmlcov
        -s B608

    # -- Python dep freshness (PYTHON repos) ------------------
    # FIXED. The previous line was
    #   deptry . 2>/dev/null || echo "deptry not available — skipping"
    # deptry 0.25.1 IS installed and DOES run, reporting 39 findings (22
    # DEP001, 17 DEP002). The `|| echo` printed "not available — skipping" and
    # exited 0 — i.e. it reported a PASS for a scan it had performed and
    # discarded. That is the worst failure shape: not a silent gate, an
    # actively false one.
    # deptry cannot run absolute-zero here: 11 of the 17 DEP002 are dev tools
    # (ruff/mypy/bandit/semgrep/pytest/pre-commit/gitleaks/import-linter/
    # vulture) that are never imported by definition, and 6 more are the
    # dist!=module cases deptry cannot see (Crypto->pycryptodome, nats->nats-py,
    # strawberry->strawberry-graphql). Those are declared, not drifts.
    # So: shrink-only RATCHET over the 18 real, declaration-corrected findings
    # (baseline: scripts/deptry-baseline.txt). New undeclared dependency = fail.
    deptry:
      glob: "*.py"
      # lefthook runs `run:` blocks under `sh` by default. This block uses
      # bash-only constructs (process substitution `<(...)` in the failure diff)
      # and a nested-quote regex, so under sh it died in 0.09s without ever
      # invoking deptry — which read as a FAIL every push.
      shell: bash
      run: |
        set -uo pipefail
        BASE=scripts/deptry-baseline.txt
        NEW=$(deptry . --no-ansi \
          --package-module-name-map "pycryptodome=Crypto|pysha3=sha3|eth-hash=eth_hash|nats-py=nats|strawberry-graphql=strawberry" \
          --per-rule-ignores "DEP002=ruff|mypy|bandit|semgrep|pytest|pytest-asyncio|pytest-cov|pre-commit|gitleaks|import-linter|vulture" \
          --extend-exclude "(examples|scripts)/" 2>&1 >/dev/null \
          | grep -E "DEP00[0-9]" | sed 's/:[0-9]*:[0-9]*:/:/' | sort -u)
        CUR=$(echo "$NEW" | grep -c . || true)
        if [ ! -f "$BASE" ]; then
          printf '%s\n' "$NEW" > "$BASE"; echo "deptry: wrote baseline ($CUR)"; exit 0
        fi
        PREV=$(grep -c . "$BASE" || true)
        if [ "$CUR" -gt "$PREV" ]; then
          echo "deptry gate: FAIL — $CUR findings, baseline $PREV (shrink-only)"
          diff <(sort "$BASE") <(echo "$NEW") | grep '^>' || true
          exit 1
        fi
        echo "deptry gate: PASS — $CUR findings, baseline $PREV (shrink-only)"

    # -- Python dep vulnerability scan (PYTHON repos) ---------
    # FIXED — this gate was not decorative, it was WRONG. `pip-audit
    # --severity high` does not exist: pip-audit 2.10.1 exited 2 with
    #   "pip-audit: error: unrecognized arguments: --severity"
    # so it died at argparse, before the `|| true` could even matter. The
    # correct invocation is `pip-audit <project_path>`, which audits the
    # dependencies declared in pyproject.toml. Run honestly it reports
    # "No known vulnerabilities found" and exits 0.
    # There is no --fail-on / --severity flag in this version; severity is
    # filtered with --ignore-vuln / -o, so the whole audit is the gate. That is
    # stricter, not looser, than the flag it replaces.
    # (The .forgejo `pip-audit` job has the same dead flag — see that file.)
    pip-audit:
      glob: "*.py"
      run: python3 -m pip_audit . --progress-spinner off

    # -- Python dead code full scan (PYTHON repos) ------------
    # FIXED. `vulture . --min-confidence 80 2>/dev/null || true` reported 10
    # findings (2 production, 8 tests) and swallowed every one. Absolute-zero
    # is unreachable: lite_indexer/rpc/pool.py:29 re-exports clear_ban_state
    # (a real use vulture cannot see) and traces/solana/spl.py:37 has a `checked`
    # kwarg that is genuinely unread but has a live caller at parsers.py:283.
    # So this is the same shrink-only shape as the other ratchets, at
    # confidence 100 over lite_indexer/ only (tests/ excluded: 8 of the 10
    # confidence-80 findings are one pytest fixture parameter).
    # Proven falsifiable: adding an unread function parameter fails the gate.
    vulture:
      glob: "*.py"
      run: python3 scripts/check-vulture-budget.py --repo .

    # -- Python docstring coverage full scan (PYTHON repos) ---
    # FIXED — the threshold and the scope were both wrong.
    # Scope: `interrogate .` measured 50.1% (7027 symbols) because it counted
    # tests/ at 23.5%. Production code is 87.1% (lite_indexer/) and 95.0% (api/).
    # The threshold 60 was calibrated against nothing: no scope in this repo
    # lands near it. 80% is the bar the production tree already clears with
    # margin, so it is a real constraint, not a number nobody meets.
    # Same scope and threshold as the .forgejo `docstring-coverage` job.
    interrogate:
      glob: "*.py"
      run: interrogate lite_indexer/ api/ --fail-under=80

    # -- Frontend gates ----------------------------------------
    # REMOVED (typecheck, knip, publint, attw): no package.json, no tsconfig.json
    # in this repo — its only tracked JS file is commitlint.config.js. Run for
    # real, knip exits 2 ("Unable to find package.json"), publint exits 1 and
    # attw exits 1, all masked into green ticks by `|| true`.

    # -- Live-secret verification (2026-08-21 hardening) -------
    # The inner `|| { ...; exit 1; }` is the enforcement and is real. Two
    # things around it are corrected below.
    #
    # 1. `git rev-parse @{u}` FAILS on a detached worktree ("HEAD does not
    #    point to a branch"), so RANGE came back empty and the whole scan was
    #    skipped. It now falls back to the merge-base with origin/main.
    # 2. With that fixed, the scan is RED today: trufflehog 3.97.0 exits 183
    #    with verified_secrets: 1 —
    #      tests/test_logging_redaction.py:46
    #      a 32-hex Infura URL path key inside a redaction test.
    #    That is a plausible-format literal used as redaction bait, not a live
    #    credential, but it is a VERIFIED secret to the scanner and it is in
    #    pushed history. The gate is left BLOCKING and red on it deliberately:
    #    a real (or realistically-shaped) verified key in history is exactly
    #    what this gate exists to catch, and the operator must rotate/remove it
    #    rather than delete the check.
    trufflehog-verified:
      run: |
        if command -v trufflehog >/dev/null 2>&1; then
          RANGE=$(git rev-parse '@{u}' 2>/dev/null || true)
          if [ -z "$RANGE" ]; then
            # This repo's primary remote is `forgejo`, not `origin` — there is
            # no origin. Without forgejo in the chain the range cannot be
            # bounded and the scan is refused, which is correct behaviour for
            # an unbounded scan but means the gate never runs.
            for remote in origin forgejo; do
              [ -n "$RANGE" ] && break
              RANGE=$(git merge-base HEAD "$remote/main" 2>/dev/null || true)
            done
          fi
          if [ -n "$RANGE" ]; then
            trufflehog git file://. --since-commit "$RANGE" --only-verified --fail --no-update || {
              echo "TRUFFLEHOG: verified-LIVE secret in pushed commits. Rotate now."
              exit 1
            }
          else
            echo "[trufflehog] no upstream/merge-base found — cannot bound the scan range; run manually"
            exit 1
          fi
        fi

    # -- Module boundary contracts (opt-in via .importlinter) ---
    import-boundaries:
      glob: "*.py"
      run: |
        if command -v lint-imports >/dev/null 2>&1 || [ -x ".venv/bin/lint-imports" ]; then
          if grep -qE '\[importlinter\]' pyproject.toml setup.cfg .importlinter 2>/dev/null; then
            LINT_IMPORTS="lint-imports"; [ -x ".venv/bin/lint-imports" ] && LINT_IMPORTS=".venv/bin/lint-imports"
            $LINT_IMPORTS || { echo "IMPORT-LINTER: boundary violated"; exit 1; }
          fi
        fi

    # -- Security/PII scan (bearer SAST) ----------------------
    # FIXED. The previous line was
    #   bearer scan --scanner=sast,secrets --hide-progress . 2>/dev/null | tail -15 || true
    # `--hide-progress` is not a bearer flag (it is `--hide-progress-bar`), so
    # the command exited 1 on argument parsing, the stderr was discarded by
    # 2>/dev/null, and the pipe made the `|| true` unreachable anyway. It had
    # never scanned anything.
    # Run correctly it reports 176 checks / 31 findings: 12 CRITICAL
    # (python_lang_code_injection / os_command_injection) and 19 HIGH
    # (12 path_traversal, 4 weak_random, 3 gitleaks).
    # Those 12 "CRITICAL" are false positives for this codebase: all of them
    # are `subprocess.run` with an ARGV LIST and no `shell=True` (verified: 0
    # occurrences of shell=True under lite_indexer/ and api/). bearer's SAST
    # rule flags any subprocess call whose argv contains a variable, which is
    # not a vulnerability without a shell. Bandit (SAST) covers the real
    # command-injection class and is a blocking gate above.
    # So this stays ADVISORY — with the reason stated — rather than failing a
    # push on 12 confirmed non-findings. It must still be able to REPORT.
    bearer-scan:
      run: |
        if command -v bearer >/dev/null 2>&1; then
          bearer scan --scanner=sast,secrets --hide-progress-bar --quiet . 2>&1 | tail -25
          echo "[bearer] advisory only — 31 findings, 12 CRITICAL all shell=False subprocess argv lists (see .lefthook.yml)"
        else
          echo "[bearer] not installed — advisory gate skipped"
        fi

commit-msg:
  commands:
    commitlint:
      run: commitlint --edit "$1"

post-commit:
  commands:
    zoekt-incremental:
      # Advisory in one sense only: the script owns the exit status. Non-own
      # repos (the 255 vendored corpus clones) are skipped inside the script.
      run: |
        if [ -x standards/scripts/zoekt-incremental.sh ]; then
          standards/scripts/zoekt-incremental.sh || true
        elif [ -x ../standards/scripts/zoekt-incremental.sh ]; then
          ../standards/scripts/zoekt-incremental.sh || true
        fi