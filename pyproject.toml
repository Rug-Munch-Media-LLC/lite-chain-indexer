[project]
name = "litechainindexer"
version = "1.3.0"
description = "Lite Chain Indexer — Lightweight multi-chain blockchain indexer using free RPCs"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Rug Munch Media LLC", email = "admin@rugmunch.io" },
]

dependencies = [
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "clickhouse-driver>=0.2.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "slowapi>=0.1.9",
    "pydantic>=2.0.0",
    "strawberry-graphql>=0.260.0",
]
dev = [
    "ruff>=0.13.0",
    "mypy>=1.18.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=4.0.0",
    "gitleaks>=8.18.0",
]
query = [
    "duckdb>=1.0.0",
]
parquet = [
    "pyarrow>=15.0.0",
]
bloom = [
    "pycryptodome>=3.20.0",
]
redis = [
    "redis>=5.0.0",
]
vectors = [
    "lancedb>=0.30.0",
    "pyarrow>=15.0.0",
]
streaming = [
    "nats-py>=2.9.0",
]
# Meta-extra: install all optional dependencies for full production deployment
all = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "slowapi>=0.1.9",
    "pydantic>=2.0.0",
    "strawberry-graphql>=0.260.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "pycryptodome>=3.20.0",
    "redis>=5.0.0",
    "lancedb>=0.30.0",
    "nats-py>=2.9.0",
]

[project.scripts]
lite-indexer = "lite_indexer.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lite_indexer*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "T20"]
ignore = [
    "E501",
    "SIM108",
    "SIM117",
    "B904",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"scripts/**/*.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unreachable = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "smoke: integration smoke tests requiring external services (CH_HOST/RPC_URL)",
]
