name: CI

# Forgejo Actions workflow — runs on the RugMunch Forgejo instance
# (git.rugmunch.io). Mirrors the essential gates that used to live in
# .github/workflows/ci.yml (which never ran — this repo is not on GitHub).

on:
  push:
    branches: [main, "wip/**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy lite_indexer/

      - name: Run tests
        run: pytest -v --tb=short

      - name: Check import
        run: python -c "from lite_indexer import LiteIndexer; print('Package import OK')"
