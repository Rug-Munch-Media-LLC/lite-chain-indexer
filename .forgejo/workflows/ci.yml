name: CI

# Forgejo Actions workflow — runs on the RugMunch Forgejo instance
# (git.rugmunch.io). Mirrors the essential gates that used to live in
# .github/workflows/ci.yml (which never ran — this repo is not on GitHub).

on:
  push:
    branches: [main, "wip/**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy lite_indexer/

      - name: Run tests
        run: pytest -v --tb=short

      - name: Check import
        run: python -c "from lite_indexer import LiteIndexer; print('Package import OK')"

  # ── Coverage gates (blocking) ─────────────────────────────────
  # Single Python version (no matrix) — coverage is version-independent.
  # Smoke-marked tests need live ClickHouse/RPC endpoints and are excluded.
  coverage-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the per-diff coverage gate (diff-cover) needs
          # origin/main as the diff base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" diff-cover

      - name: Unit tests with coverage (BLOCKING)
        # Tests MUST pass and global coverage must meet the 60% floor.
        # covgate (the Rust CLI used by frontend repos) does not parse Python
        # coverage output; diff-cover provides the same per-diff gate below.
        run: |
          pytest -m "not smoke" -q --tb=short \
            --cov=lite_indexer \
            --cov-report=term \
            --cov-report=xml:coverage.xml \
            --cov-report=lcov:coverage.lcov \
            --cov-fail-under=60

      - name: Per-diff coverage gate (diff-cover — BLOCKING)
        # Ratchet: lines CHANGED vs origin/main must be >=60% covered.
        # On pushes to main the diff is empty and this passes trivially.
        run: diff-cover coverage.xml --compare-branch=origin/main --fail-under=60

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.lcov
# Append these jobs under `jobs:` in any repo's ci.yml. Self-contained.
  supply-chain:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install scanners
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl git ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner && chmod +x /usr/local/bin/osv-scanner
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/latest/download/trufflehog_linux_amd64.tar.gz | tar xz -C /usr/local/bin trufflehog
      - name: OSV dependency scan (hallucinated/vulnerable deps)
        run: osv-scanner scan source --format table ./ || echo "::warning::OSV findings — triaged baseline, see log"
      - name: Trufflehog verified-live secrets (all history)
        run: trufflehog git file://. --only-verified --fail --no-update

  nightly-deep-scan:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Noseyparker full-history secret hunt
        run: |
          curl -sSfL https://github.com/praetorian-inc/noseyparker/releases/latest/download/noseyparker-v0.24.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker scan --git-history-format all . || true
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker report || true
      - name: Grype vulnerability match on working tree
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype dir:. --fail-on critical || echo "::warning::critical vulns in tree"
