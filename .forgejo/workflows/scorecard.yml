# OpenSSF Scorecard — automated security assessment
# Scores 0-10 across 18 checks (branch protection, signed releases, token permissions, etc.)
# Runs weekly (Monday 6AM UTC) and on push to main
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    runs-on: docker-x64
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard analysis
        uses: ossf/scorecard-action@v2
        with:
          results_file: scorecard-results.json
          results_format: json
          publish_results: true

      - name: Upload scorecard artifact
        uses: actions/upload-artifact@v3
        with:
          name: scorecard-results
          path: scorecard-results.json

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
