# NATS server configuration for LiteChainIndexer streaming.
#
# Loaded by compose.nats.yml (nats:2.10-alpine). JetStream is enabled via
# the `-js` command-line flag; this file configures the store location,
# the monitoring dashboard, and WebSocket access.
#
# NOTE: binds are exposed on 127.0.0.1 only via compose port mappings.
# No auth is configured — this is a localhost dev/streaming server, not a
# public endpoint. For public exposure, put NATS behind nginx/cloudflared
# and enable TLS + authorization.

server_name: lite-chain-indexer-nats

# JetStream store directory (persisted via the nats-data volume).
store_dir: /data/jetstream

# Monitoring dashboard + health endpoint (compose maps 127.0.0.1:8222).
http: 8222

# WebSocket access for browser/JS clients (compose maps 127.0.0.1:8080).
# TLS is disabled because the server is loopback-only; enable `tls {}`
# when exposing publicly.
websocket {
    port: 8080
    no_tls: true
    compression: true
}
