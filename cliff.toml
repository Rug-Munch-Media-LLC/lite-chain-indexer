# git-cliff configuration — changelog generation (see the `changelog` job
# in .forgejo/workflows/ci.yml).
# Docs: https://git-cliff.org/docs/configuration
#
# Parses conventional commits (feat/fix/security/perf/refactor/docs/style/
# test/build/ci/chore/revert) and groups them into release sections.
# The committed CHANGELOG.md is hand-curated; CI generates to a temp file
# so it is never clobbered. Run `git-cliff --output` for a fully generated
# file.

[changelog]
header = """
# Changelog

All notable changes to the lite-chain-indexer project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
trim = true
# Keep the hand-curated changelog below the generated section when prepending.
postprocessors = []

[git]
# Parse commits according to the conventional commits specification.
conventional_commits = true
# Skip commits that are not conventional (merge commits, reverts, etc.).
filter_unconventional = true
# Never drop breaking changes, even if they don't match a parser.
protect_breaking_commits = true
# Group assignment — order matters; first regex match wins.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^security", group = "<!-- 2 -->🛡️ Security" },
    { message = "^perf", group = "<!-- 3 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 4 -->🚜 Refactor" },
    { message = "^docs?", group = "<!-- 5 -->📚 Documentation" },
    { message = "^style", group = "<!-- 6 -->🎨 Styling" },
    { message = "^test", group = "<!-- 7 -->🧪 Testing" },
    { message = "^build", group = "<!-- 8 -->📦 Build" },
    { message = "^ci", group = "<!-- 9 -->⚙️ CI" },
    { message = "^chore", group = "<!-- 10 -->🧹 Chore" },
    { message = "^revert", group = "<!-- 11 -->◀️ Revert" },
    { message = ".*", group = "<!-- 12 -->💼 Other" },
]
# Order commits within each group oldest-first (matches Keep a Changelog).
sort_commits = "oldest"
# Skip operational tags (checkpoint/restore-point) that are not releases.
ignore_tags = "^checkpoint/.*|^restore-point/.*"
