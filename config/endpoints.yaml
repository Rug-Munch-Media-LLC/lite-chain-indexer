# LiteChainIndexer — RPC Endpoint Configuration
#
# 111 endpoints across 14 chains (expanded from 42 — +69 new)
# All endpoints verified to support eth_getLogs on free tier.
#
# Each chain has endpoints in 3 tiers:
#   T1 (indices 0-1): Fastest, most reliable
#   T2 (indices 2-4): Fallbacks
#   T3 (indices 5+):  Last resort
#
# Provider rate limits and max block ranges are configured in chains.py.

ethereum:
  - "https://virginia.rpc.blxrbdn.com"       # T1 — bloxroute
  - "https://eth.meowrpc.com"                # T1 — meowrpc
  - "https://eth.api.onfinality.io/public"    # T2 — onfinality
  - "https://1rpc.io/eth"                    # T2 — 1rpc
  - "https://eth.drpc.org"                   # T2 — drpc.org
  - "https://cloudflare-eth.com"             # T3 — cloudflare
  - "https://ethereum-rpc.publicnode.com"    # T3 — publicnode
  - "https://eth-mainnet.public.blastapi.io" # T3 — blastapi
  - "https://eth.merkle.io"                  # T3 — merkle
  - "https://eth-mainnet.gateway.tatum.io"   # T3 — tatum
  - "https://rpc.mevblocker.io"              # T3 — mevblocker
  - "https://rpc.ankr.com/eth"               # T3 — ankr

